# Prometheus — scraping del stack (DD-12).
# Scrapea las metricas que la API FastAPI expone en /metrics (prometheus-client).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Instancias FastAPI. Con escalado horizontal (`--scale api=N`), Docker DNS
  # resuelve `api` a las replicas; ajustar a service discovery en K8s mas adelante.
  - job_name: proctoring-api
    metrics_path: /metrics
    # `/metrics` dejo de ser publico (c-78 16.3): sin `METRICS_TOKEN` en el
    # servicio `api` el endpoint responde 404, y con la variable exige Bearer.
    # Este stack toma su config del `.env` de la raiz (gitignoreado) y Prometheus
    # NO interpola variables de entorno, asi que para levantarlo hay que
    # descomentar el bloque de abajo con el mismo valor que el `.env`:
    #
    # authorization:
    #   type: Bearer
    #   credentials: <mismo valor que METRICS_TOKEN en el .env>
    static_configs:
      - targets: ["api:8000"]
