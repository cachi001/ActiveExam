# Prometheus para el stack local activeexam (docker-compose.dev.yml).
# Descartable / uso puntual de prueba de carga: apunta al servicio real
# `backend` de ese compose (no `api`, que es el nombre del stack "full").
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: activeexam-backend
    metrics_path: /metrics
    # `/metrics` dejo de ser publico (c-78 16.3): sin credencial responde 404.
    # El token es DEV-ONLY y tiene que coincidir con METRICS_TOKEN del servicio
    # `backend` en docker-compose.dev.yml. En produccion se inyecta por el
    # dashboard del proveedor, nunca desde el repo.
    authorization:
      type: Bearer
      credentials: dev-only-metrics-scrape-token
    static_configs:
      - targets: ["backend:8000"]
