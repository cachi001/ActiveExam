# Prometheus para el stack local activeexam (docker-compose.dev.yml).
# Descartable / uso puntual de prueba de carga: apunta al servicio real
# `backend` de ese compose (no `api`, que es el nombre del stack "full").
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: activeexam-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
