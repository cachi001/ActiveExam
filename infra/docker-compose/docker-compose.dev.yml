# =============================================================================
# Stack de DESARROLLO que ESPEJA produccion (Railway = backend activeexam + Postgres).
#
# Objetivo: que cualquiera al CLONAR el repo pueda testear "como en prod" con un
# solo comando — sin modo demo, con login JWT real y los usuarios de prueba
# (admin / estudiante1 / coordinador1) creados SIEMPRE via seed idempotente.
#
# Uso:
#   docker compose -f infra/docker-compose/docker-compose.dev.yml up --build
#   (o el wrapper:  scripts/dev-up.ps1  /  scripts/dev-up.sh)
#
# Luego el frontend (en otra terminal):
#   cd frontend && npm install && npm run dev   ->  http://localhost:5173
#
# SECRETOS: los valores de abajo son DEV-ONLY (DB local, JWT y Fernet de juguete).
# NO son secretos de produccion. En prod se inyectan por el dashboard de Railway.
# =============================================================================

name: activeexam-dev

services:
  # --- Base de datos: Postgres estandar (la rama de migraciones activeexam NO usa
  #     TimescaleDB, a diferencia del stack full). -----------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: proctoring
      POSTGRES_PASSWORD: dev-only-change-me
      POSTGRES_DB: proctoring
    ports:
      - "5432:5432" # expuesto para inspeccionar con psql/DBeaver desde el host
    # DEV EFIMERO (create-drop): el dato vive en RAM (tmpfs), NO en un volumen.
    # Cada `up` arranca con una BD vacia -> el `command` de abajo migra (crea schema)
    # y seedea de cero; al parar el contenedor el dato se descarta. Asi dev nunca
    # arrastra estado viejo. PROD persiste normal (docker-compose.yml, sin tmpfs).
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proctoring -d proctoring"]
      interval: 5s
      timeout: 5s
      retries: 10
      # El init de primera vez (crear el data dir) puede tardar; no contar fallos
      # de healthcheck durante ese arranque para no marcar el contenedor unhealthy.
      start_period: 60s

  # --- MinIO: bucket WORM de evidencia (c-77), Object Lock Compliance desde el
  #     arranque. En Render (prod hoy) esto NO existe todavia (sin VPS) — el
  #     backend arranca igual sin MINIO_* seteado. En DEV, en cambio, SIEMPRE
  #     esta disponible para poder probar el flujo completo de punta a punta. ---
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: dev-only-minio-secret-change-me
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # consola web
    # DEV EFIMERO (igual que postgres arriba): el bucket se recrea con Object
    # Lock en cada `up` via el init container `minio-init` de abajo.
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  # --- Init idempotente: crea el bucket de evidencia CON Object Lock habilitado.
  #     Object Lock solo se puede activar en la CREACION del bucket (S3/MinIO) —
  #     por eso es un paso aparte, corre una vez y termina (no es un servicio
  #     long-running). Mismo estilo que el seed idempotente del backend. -------
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000 minioadmin dev-only-minio-secret-change-me &&
        (mc mb --with-lock local/activeexam-evidencia || true) &&
        echo '>>> bucket activeexam-evidencia listo (Object Lock habilitado)'
      "

  # --- Backend activeexam (mismo Dockerfile.activeexam que Railway). Al arrancar:
  #     1) migra (alembic activeexam@head)  2) seed de usuarios  3) uvicorn ----------
  backend:
    build:
      context: ../.. # raiz del repo: el Dockerfile.activeexam copia backend/ y frontend/public/mediapipe/
      dockerfile: Dockerfile.activeexam
    environment:
      DATABASE_URL: postgresql+asyncpg://proctoring:dev-only-change-me@postgres:5432/proctoring
      FRONTEND_ORIGIN: http://localhost:5173
      JWT_OWN_SECRET: dev-only-insecure-jwt-secret-change-me-0123456789abcdef
      EMBEDDING_ENCRYPTION_KEY: VXqRzW9ksjWE2eCa752juwQdOtAPCrYVnratlmHj7b0=
      PORT: "8000"
      ENVIRONMENT: development
      # Passwords del seed (dev-only). El seed es idempotente: no duplica.
      SEED_ADMIN_PASSWORD: Admin123
      SEED_ESTUDIANTE_PASSWORD: Estudiante123
      SEED_COORDINADOR_PASSWORD: Coordinador123
      SEED_TUTOR_PASSWORD: Tutor123
      # Moodle write-back (C-69/C-73): se INTERPOLAN desde el .env de la raíz
      # (docker compose --env-file .env ...). El token NUNCA se hornea en la imagen
      # ni se versiona: vive solo en el .env gitignoreado. Vacío = write-back off.
      # base_url NO es secreta (URL pública del campus) → default a campustest.
      # El TOKEN sí es secreto → solo del .env, nunca default en el repo.
      MOODLE_BASE_URL: ${MOODLE_BASE_URL:-https://campustest.frm.utn.edu.ar}
      MOODLE_WS_TOKEN: ${MOODLE_WS_TOKEN:-}
      MOODLE_COURSEID: ${MOODLE_COURSEID:-0}
      MOODLE_CMID: ${MOODLE_CMID:-0}
      MOODLE_COMPONENT: ${MOODLE_COMPONENT:-mod_assign}
      # MinIO / bucket WORM (c-77): en DEV SIEMPRE configurado (a diferencia de
      # Render hoy, sin VPS) para poder probar el flujo completo localmente.
      # Las 4 variables son opcionales en produccion — minio_configurado() exige
      # las 4 juntas o ninguna (nunca arranca "a medias").
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: dev-only-minio-secret-change-me
      MINIO_BUCKET_EVIDENCIA: activeexam-evidencia
      MINIO_USE_SSL: "false"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    # Pisa el CMD del Dockerfile.activeexam para INTERCALAR el seed entre migrar y servir.
    command:
      - sh
      - -c
      - |
        echo ">>> [1/3] migrando DB (alembic activeexam@head)..." && \
        alembic -c alembic.ini upgrade activeexam@head && \
        echo ">>> [2/3] seed de usuarios (idempotente)..." && \
        python scripts/seed_users.py --activeexam && \
        echo ">>> [3/3] levantando uvicorn en :8000" && \
        uvicorn app.main_activeexam:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips="*" --workers 4
