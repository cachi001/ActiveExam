[project]
name = "proctoring-backend"
version = "0.1.0"
description = "Backend de la plataforma de proctoring (FastAPI/ASGI, Clean/Hexagonal)."
requires-python = ">=3.12"

# Dependencias pinneadas por version (reproducibilidad). El stack del MVP sigue
# la hipotesis A4: ni Redis ni RabbitMQ/Celery se incluyen por defecto (DD-19);
# se agregan solo si la PoC C-03 los promueve por metrica.
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "sqlalchemy==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    # Driver SYNC para Alembic: migrations/env.py corre sincrono y strippea
    # +asyncpg -> queda 'postgresql://' que SQLAlchemy mapea al dialecto psycopg2
    # por default. La app usa asyncpg; Alembic usa psycopg2. Sin esto, el image
    # runtime (pip install . = solo estas deps, NO el extra dev) no trae ningun
    # driver sync -> ModuleNotFoundError: psycopg2 al migrar. Espeja requirements.txt.
    "psycopg2-binary==2.9.10",
    # Auth/JWT (C-06): validacion LOCAL de JWT RS256 contra el JWKS de Keycloak.
    # 'crypto' trae el backend de claves publicas (cryptography) para RS256.
    "pyjwt[crypto]==2.10.1",
    # Hashing de passwords (C-55): bcrypt 12 rounds para el provider JWT propio.
    # bcrypt debe ser < 5.0 (passlib 1.7.4 no soporta la nueva API de bcrypt 5.x).
    "passlib[bcrypt]==1.7.4",
    "bcrypt<5.0",
    # Observabilidad (DD-12)
    "prometheus-client==0.21.1",
    "opentelemetry-sdk==1.29.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.29.0",
    "opentelemetry-instrumentation-fastapi==0.50b0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0", # pineado: 1.x rompe el loop-scoping de los fixtures async (asyncpg "different loop")
    "httpx==0.28.1",          # TestClient de FastAPI
    "psycopg[binary]==3.2.3", # smoke de conectividad a Postgres
    "requests==2.32.3",       # smoke de conectividad MinIO/Keycloak
    "ruff==0.8.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
# pytest-asyncio: usar el mismo event loop para tests y fixtures session-scoped.
# Sin esto, fixtures session-scoped que abren conexiones async (ej. slim_engine
# de tests/proctoring/conftest.py) se cierran cuando termina el primer loop y
# disparan "RuntimeError: Event loop is closed" en los siguientes tests.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# snake_case obligatorio (regla dura de codigo) — pep8-naming + pyflakes.
select = ["E", "F", "N", "I", "UP"]
